  # --- Observability ---
  - id: OBS-001
    description: "Metrics endpoint exposes required metric families"
    workstream: H9
    verification:
      type: unit_test
      expected: metric_families_present

  - id: OBS-002
    description: "Trace propagation across API, relay, consumer"
