# Prometheus scrape configuration for the local ITSM stack.
# Mounted read-only into prom/prometheus:v3.15.1 by compose.yaml.
#
# App-owned targets (api, worker) may be down until the application slice
# lands; Prometheus tolerates down scrape targets and the compose healthcheck
# only gates Prometheus itself.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OpenTelemetry Collector self-metrics (receiver/exporter health).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Application metrics exported by the collector's Prometheus exporter
  # (OTLP in on 4317/4318, Prometheus-format out on 8889).
  - job_name: otel-exported-app-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # Application-owned /metrics endpoints. Uncomment when the app slice lands;
  # kept commented so Prometheus does not scrape a nonexistent service.
  # - job_name: api
  #   static_configs:
  #     - targets: ["api:8000"]
  # - job_name: worker
  #   static_configs:
  #     - targets: ["worker:8000"]
