# Prometheus scrape configuration for the local ITSM stack.
# Mounted read-only into prom/prometheus:v3.15.1 by compose.yaml.
#
# Scrape targets:
#   - prometheus        : self
#   - otel-collector    : receiver/exporter health (8888)
#   - otel-exported-app : metrics the collector exports from OTLP (8889)
#   - api               : the API's own /metrics endpoint (8000)
#
# A target that is down is tolerated by Prometheus; the compose healthcheck
# only gates Prometheus itself.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OpenTelemetry Collector self-metrics (receiver/exporter health).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Application metrics exported by the collector's Prometheus exporter
  # (OTLP in on 4317/4318, Prometheus-format out on 8889).
  - job_name: otel-exported-app-metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # The API serves the module-owned Prometheus registry on /metrics.
  # The path is fixed by the route in itsm_agent.api.app; the port matches
  # ITSM_API_PORT in compose.yaml.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # The worker processes (audit consumer, remediation worker, outbox relay,
  # retention scheduler) have NO HTTP listener: they are not web servers and
  # no exporter is mounted into them. Their counters reach Prometheus through
  # the OTLP path above once the traces/metrics exporter is configured, so
  # there is deliberately no "worker" scrape job here. See
  # docs/observability.md ("Scrape targets and what is not scraped").
