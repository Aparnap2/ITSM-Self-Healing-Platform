# OpenTelemetry Collector (contrib) configuration for the local ITSM stack.
# Mounted read-only into otel/opentelemetry-collector-contrib:0.164.0 by
# compose.yaml.
#
# OTLP in (grpc 4317 / http 4318) -> batch -> Prometheus exporter (8889) for
# metrics; traces and logs go to the `debug` exporter for local inspection.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  # Collector self-telemetry. Prometheus scrapes :8888 (see
  # observability/prometheus/prometheus.yml); without this reader the
  # collector serves nothing there and that declared target is always down.
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
