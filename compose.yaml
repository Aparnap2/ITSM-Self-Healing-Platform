# =============================================================================
# ITSM self-healing platform — local development & acceptance stack (PRD §11)
#
# Ownership: DEVOPS slice. Application services (api, worker) reference a
# Dockerfile owned by the application agents; until that file exists the
# infrastructure services below run standalone (see docs/runbooks/
# SOP-01-start-environment.md).
#
# Security rules encoded here:
#   - Every image is version-pinned (no :latest).
#   - Every published port is bound to 127.0.0.1 only.
#   - POSTGRES_PASSWORD has NO default: compose fails closed if unset.
#   - LocalStack is quarantined behind the "localstack" profile (ADR-0003);
#     Moto (in-process, via pytest) remains the default AWS simulator.
# =============================================================================

name: itsm

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — durable business state, source of truth (PRD §3)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itsm}
      POSTGRES_USER: ${POSTGRES_USER:-itsm}
      # Fail closed: no default password. Provide POSTGRES_PASSWORD in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see .env.example)}
      # Used only by the first-boot init hook that creates the itsm_app login.
      ITSM_RUNTIME_DB_PASSWORD: ${ITSM_RUNTIME_DB_PASSWORD:?ITSM_RUNTIME_DB_PASSWORD must be set in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/01-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ---------------------------------------------------------------------------
  # NATS + JetStream — asynchronous event backbone (PRD §3)
  # Monitor port 8222 exposes /healthz for the healthcheck and inspection.
  # JetStream state is stored on a named volume; `make compose-reset` wipes it.
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.12.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------------
  # Demo state bootstrap — one-shot, root-only, private-network.
  #
  # Creates the bind-mounted directory the identity simulator writes its TLS
  # material into and hands it to the simulator's unprivileged user. Without
  # this the simulator cannot write to a root-owned bind mount, and the demo
  # stack would "start" while every TLS fetch failed.
  #
  # Mode 0755 on the directory (not 0700): the host-side readiness probe and
  # rehearsal runner must read the CA. The private key itself is written 0600
  # by the simulator.
  # ---------------------------------------------------------------------------
  demo-init:
    image: alpine:3.20.3
    user: "0:0"
    command:
      - sh
      - -c
      - "mkdir -p /state && chown -R 10001:10001 /state && chmod 0755 /state"
    volumes:
      - ./demo-state/identity:/state
    restart: "no"

  # ---------------------------------------------------------------------------
  # Identity simulator — LOCAL RS256 signing authority (WP-B/WP-I).
  #
  # It signs tokens and publishes its JWKS; it holds NO application
  # authorization (no role or tenant claim is ever minted). The relying party
  # resolves reviewer state from the reviewer directory in PostgreSQL.
  #
  # Reachability: the service must listen on a routable address so the api
  # container can fetch its JWKS, hence --allow-container-bind. The host port
  # is still published on 127.0.0.1 only, TLS is always on, and the CA is
  # pinned by every client — verification is never disabled.
  # ---------------------------------------------------------------------------
  identity:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The simulator refuses to run outside local/test/staging.
      ITSM_ENV: ${ITSM_ENV:-staging}
    command:
      - python
      - -m
      - itsm_agent.simulators.identity
      - --issuer
      - ${ITSM_OIDC_ISSUER:-https://identity:8443}
      - --audience
      - ${ITSM_OIDC_AUDIENCE:-itsm-audience}
      - --subject
      - reviewer-a
      - --subject
      - reviewer-b
      # Deliberately NOT provisioned in the reviewer directory. A token minted
      # for it must be refused by the API: that is the live proof that a
      # signature is authentication, never authorization.
      - --subject
      - reviewer-intruder
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --public-url
      - ${ITSM_OIDC_ISSUER:-https://identity:8443}
      - --tls-hostname
      - identity
      - --tls-hostname
      - localhost
      - --tls-hostname
      - 127.0.0.1
      - --state-dir
      - /state
      - --allow-container-bind
    volumes:
      # Bind-mounted, not a named volume: the rehearsal runner and the
      # readiness probe on the host pin this same CA file.
      - ./demo-state/identity:/state
    depends_on:
      demo-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${IDENTITY_HOST_PORT:-8443}:8443"
    healthcheck:
      # Proves TLS + pinned-CA + the discovery surface, not just a live port.
      test:
        - CMD
        - python
        - -c
        - |
          import ssl, urllib.request
          ctx = ssl.create_default_context(cafile="/state/simulator-ca.pem")
          urllib.request.urlopen("https://localhost:8443/healthz", context=ctx, timeout=3)
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Migrations — one-shot gate. Runs as the ADMIN login (the schema owner),
  # never as itsm_app; every application service waits for it to succeed.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONPATH: /app/src
    command:
      - python
      - -m
      - migrations.apply
      - --dsn
      - postgresql://${POSTGRES_USER:-itsm}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-itsm}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Mockoon — deterministic external API simulator (ITSM / identity / infra).
  # Contract: simulators/mockoon/README.md. Config mounted read-only.
  # Admin API disabled to keep the mock surface minimal.
  # ---------------------------------------------------------------------------
  mockoon:
    image: mockoon/cli:9.5.0
    # Image ENTRYPOINT is `mockoon-cli start`; flags only (per upstream docs).
    command:
      - --data
      - /home/mockoon/data/mockoon.json
      - --port
      - "3001"
      - --disable-admin-api
    volumes:
      - ./simulators/mockoon/mockoon.json:/home/mockoon/data/mockoon.json:ro
    ports:
      - "127.0.0.1:${MOCKOON_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — OTLP receiver -> Prometheus exporter + debug.
  # No healthcheck: the contrib image ships no HTTP client; readiness is
  # implied by `service_started` (documented in SOP-01).
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes the collector's Prometheus exporter (8889), the
  # collector's own metrics (8888), and the application /metrics endpoints.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------------
  # Application services (api + worker).
  # NOTE(devops): the Dockerfile and start commands are owned by the
  # application slice. This compose file wires networking, env, and
  # dependencies; adjust `command:` here only if the worker needs a
  # different entrypoint than the image CMD.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Constrained runtime role; the app lifespan rejects a role that can
      # bypass RLS, so the admin user must not be used here.
      DATABASE_URL: postgresql://itsm_app:${ITSM_RUNTIME_DB_PASSWORD:?ITSM_RUNTIME_DB_PASSWORD must be set in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-itsm}
      NATS_URL: nats://nats:4222
      # Staging-compatible: OIDC only. `config.py` refuses ITSM_AUTH_MODE=hmac
      # when ITSM_ENV=staging, so this stack cannot silently fall back to the
      # development HMAC bearer.
      ITSM_ENV: staging
      ITSM_API_HOST: 0.0.0.0
      ITSM_API_PORT: "8000"
      ITSM_WEBHOOK_SECRET: ${ITSM_WEBHOOK_SECRET:?ITSM_WEBHOOK_SECRET must be set in .env (see .env.example)}
      ITSM_AUTH_MODE: oidc
      # The simulator is the signing authority; the reviewer directory in
      # PostgreSQL remains the authorization source.
      ITSM_OIDC_ISSUER: ${ITSM_OIDC_ISSUER:-https://identity:8443}
      ITSM_OIDC_AUDIENCE: ${ITSM_OIDC_AUDIENCE:-itsm-audience}
      ITSM_OIDC_JWKS_URL: ${ITSM_OIDC_JWKS_URL:-https://identity:8443/jwks}
      # Pin the simulator's CA. TLS verification is never disabled.
      ITSM_OIDC_JWKS_CA_FILE: /identity-ca/simulator-ca.pem
      ITSM_OIDC_ALGORITHMS: RS256
      ITSM_MOCKOON_ITSM_BASE_URL: http://mockoon:3001
      ITSM_MOCKOON_IDENTITY_BASE_URL: http://mockoon:3001
      ITSM_MOCKOON_INFRASTRUCTURE_BASE_URL: http://mockoon:3001
      # Canonical OTLP endpoint variable read by itsm_agent.config. The
      # OpenTelemetry standard name is kept as a fallback (see
      # docs/observability.md).
      ITSM_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ITSM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "-m", "itsm_agent.api"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      mockoon:
        condition: service_healthy
      otel-collector:
        condition: service_started
      # Schema must exist before the API opens a pool against it.
      migrate:
        condition: service_completed_successfully
      # The CA the API pins is written by the simulator at startup.
      identity:
        condition: service_healthy
    volumes:
      - ./demo-state/identity:/identity-ca:ro
    healthcheck:
      # A real request, so `docker compose up --wait` means "the API answers",
      # not merely "the container process exists".
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3)
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://itsm_app:${ITSM_RUNTIME_DB_PASSWORD:?ITSM_RUNTIME_DB_PASSWORD must be set in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-itsm}
      NATS_URL: nats://nats:4222
      ITSM_API_BASE_URL: http://mockoon:3001
      IDENTITY_API_BASE_URL: http://mockoon:3001
      INFRA_API_BASE_URL: http://mockoon:3001
      # Deliberately NO ITSM_INVESTIGATION_* / ITSM_GROQ_* settings here.
      # This service runs `itsm_agent.workers.consumer`, the remediation
      # workflow consumer; it never reads them, so declaring them here would
      # describe an investigation stage that this process does not run.
      # Detection + the advisory investigation stage live in the packaged
      # `itsm_agent.workers.audit_consumer`, which the rehearsal drives
      # in-process (`make demo-run`) because it binds the same durable
      # consumer (`itsm-workflow`) and two processes cannot share it.
      ITSM_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ITSM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      mockoon:
        condition: service_healthy
      otel-collector:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "itsm_agent.workers.consumer"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Outbox relay — PostgreSQL outbox -> NATS JetStream. Separate process from
  # the consumer so a broker outage cannot stop both sides of the pipeline.
  # Runs one RLS-scoped pass per tenant (`OutboxRelay.run`).
  # ---------------------------------------------------------------------------
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://itsm_app:${ITSM_RUNTIME_DB_PASSWORD:?ITSM_RUNTIME_DB_PASSWORD must be set in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-itsm}
      NATS_URL: nats://nats:4222
      ITSM_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ITSM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      otel-collector:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "itsm_agent.workers.relay"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Retention scheduler — leases due erasure requests, applies policy and legal
  # holds, and commits deletions with their audit record. Destructive, so it
  # fails closed at startup unless the role is NOBYPASSRLS.
  # ---------------------------------------------------------------------------
  retention:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://itsm_app:${ITSM_RUNTIME_DB_PASSWORD:?ITSM_RUNTIME_DB_PASSWORD must be set in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-itsm}
      ITSM_RETENTION_INTERVAL_SECONDS: ${ITSM_RETENTION_INTERVAL_SECONDS:-60}
      ITSM_RETENTION_BATCH_SIZE: ${ITSM_RETENTION_BATCH_SIZE:-10}
      ITSM_RETENTION_LEASE_SECONDS: ${ITSM_RETENTION_LEASE_SECONDS:-60}
      ITSM_RETENTION_MAX_ATTEMPTS: ${ITSM_RETENTION_MAX_ATTEMPTS:-5}
      ITSM_RETENTION_BACKOFF_SECONDS: ${ITSM_RETENTION_BACKOFF_SECONDS:-30}
      ITSM_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ITSM_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "itsm_agent.workers.retention"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # LocalStack — QUARANTINED (ADR-0003). Opt-in only via:
  #   docker compose --profile localstack up -d localstack
  # License/plan terms must be verified before any use beyond local
  # evaluation. Moto (in-process) remains the default AWS simulator.
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:4.14.0
    profiles: ["localstack"]
    environment:
      LOCALSTACK_SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  postgres-data:
  nats-data:
