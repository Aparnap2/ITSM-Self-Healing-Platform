[project]
name = "itsm-agent"
version = "0.1.0"
description = "Headless ITSM self-healing platform: event-driven agentic remediation with deterministic policy enforcement and auditable outcomes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "ITSM Agent Team" }]
dependencies = [
    "pydantic>=2.7,<3",
    "langgraph>=0.2,<2",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "nats-py>=2.6,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1,<26",
    "tenacity>=8.3,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "respx>=0.21,<1",
    "moto[s3,sts]>=5,<6",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp>=1.25,<2",
    "prometheus-client>=0.20,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itsm_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "unit: fast, isolated tests with no network or containers",
    "contract: adapter contract tests against simulators",
    "integration: full-stack tests requiring Docker services",
    "security: policy and safety invariant tests",
    "fault_injection: deterministic fault injection tests",
    "scenarios: end-to-end scenario suite",
]
