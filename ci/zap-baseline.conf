# OWASP ZAP baseline rule configuration (CI gate).
#
# Unlisted rules are downgraded to INFO by the `-i` flag in tools/dast.sh, so
# only the explicitly FAIL-listed rules can fail the job. Each FAIL rule below
# maps to a header the application actually sets; a regression in
# src/itsm_agent/api/app.py therefore breaks the DAST lane.
#
# Format: <rule-id>\t<ACTION>\t(<name>)
# See https://www.zaproxy.org/docs/docker/baseline-scan/#configuration-file

10015	FAIL	(Incomplete or No Cache-control and Pragma HTTP Header Set)
10020	FAIL	(X-Frame-Options Header Scanner)
10021	FAIL	(X-Content-Type-Options Header Missing)
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10063	FAIL	(Permissions Policy Header Not Set)

# HSTS is intentionally not asserted: the isolated target is plain HTTP on
# 127.0.0.1. TLS termination and HSTS belong to the deployment edge, which is
# out of scope for this repository's DAST lane.
10035	IGNORE	(Strict-Transport-Security Header Not Set)
