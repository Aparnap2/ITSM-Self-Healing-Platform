# Minimal NATS server config for the CI integration-test service container.
# Mounted over /etc/nats/nats-server.conf (the image's default CMD loads this
# path; GitHub Actions services cannot override CMD).
#
# store_dir points at /tmp, which is always writable by the container user —
# avoids the named-volume permission issue seen with JetStream data dirs.

port: 4222
monitor_port: 8222

jetstream {
  store_dir: "/tmp/nats-jetstream"
}
