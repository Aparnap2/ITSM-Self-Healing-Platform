# CI pipeline for the ITSM self-healing platform.
#
# Local gates run first (Makefile); CI is the safety net, not the first line
# of defence. Deterministic tests never require network, Ollama, or
# GROQ_API_KEY (PRD §9.3).
#
# Suite contract (CI-0): every job's pytest selector must collect non-zero
# tests — zero-collected selection exits code 5 and fails the job. Every test
# target additionally runs the `guard-collect` preflight (Makefile), which
# fails loudly on a zero-collection selection and records the collected count
# in reports/<suite>.collect.txt so the summary can cross-check it against
# the JUnit report.
#
# All service-backed jobs set ITSM_TEST_STRICT=1 so unreachable services FAIL
# instead of silently skipping (tests read ITSM_TEST_PG_DSN /
# ITSM_TEST_NATS_URL; the worker also accepts ITSM_POSTGRES_DSN/ITSM_NATS_URL
# and DATABASE_URL/NATS_URL fallbacks — see
# src/itsm_agent/workers/consumer.py). Every job that starts PostgreSQL or
# NATS also asserts the service is reachable before the suite runs, so a
# down service is a red job rather than a green-with-skips job.
#
# Provenance (CI-0): every mandatory report is uploaded with an explicit
# retention window (ARTIFACT_RETENTION_DAYS) together with a provenance
# stamp (reports/<suite>.meta) recording sha/run_id/run_attempt. The CI
# Verification Summary proves that every report came from THIS run, so a
# stale artifact cannot be presented as evidence.
#
# Required set: all 15 jobs are required. tools/ci_summary.py names them
# explicitly (REQUIRED_JOBS) and fails on a missing job, a missing or empty
# report, a failure/error, a silently skipped suite, or any required job
# that did not succeed — DAST included.
#
# All third-party actions are pinned to commit SHAs, not tags. Every job
# declares least-privilege `permissions:` and a `timeout-minutes`.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a main-branch verification:
  # the release path depends on a completed run for the tagged commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Explicit artifact retention window. The CI Verification Summary derives
  # and prints the expiry from this value and fails when it is not declared.
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  # --------------------------------------------------------------------------
  # Fast gates — run in parallel, fail fast
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: Ruff format check
        run: make format-check
      - name: Ruff lint
        run: make lint

  typecheck:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: mypy strict
        run: make typecheck

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # gitleaks-action lists the commits of a pull request through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so gitleaks can scan all commits
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Supply chain (CI-0): dependency vulnerabilities, SAST, SBOM
  # --------------------------------------------------------------------------
  supply-chain:
    name: Supply Chain (pip-audit, bandit, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: SAST scan (bandit, must exit 0)
        run: make sast
      - name: Dependency vulnerability audit (pip-audit)
        run: make audit-deps
      - name: IaC / Dockerfile / secret scan (Trivy, must exit 0)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: "vuln,misconfig,secret"
          skip-dirs: ".venv,.git"
          # Intentional AWS key-shaped fixture used to prove redaction works.
          skip-files: "tests/unit/test_redaction.py"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
      - name: Create reports directory
        run: mkdir -p reports
        if: always()
      - name: Generate SBOM (CycloneDX over source tree)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: reports/sbom.cyclonedx.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: reports/sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # --------------------------------------------------------------------------
  # Workflow / CI configuration security (OWASP GitHub Actions guidance)
  # --------------------------------------------------------------------------
  workflow-security:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # advanced-security=false makes findings a blocking CI signal; the
      # default (true) only uploads SARIF and never fails the job.
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: "false"
          min-severity: medium
          min-confidence: high

  # --------------------------------------------------------------------------
  # Deterministic test suites — no network, no LLM, no Ollama
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      # Unreachable services are a hard failure in CI, never a green skip.
      ITSM_TEST_STRICT: "1"
      # Deliberately NO GROQ_API_KEY: unit tests must pass without it.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: Stamp the run identity for artifact provenance
        run: make ci-stamp REPORT=unit-junit REPORT_JOB=unit-tests
      - name: Run unit tests
        run: |
          mkdir -p reports
          make test-unit PYTEST_OPTS='--junitxml=reports/unit-junit.xml'
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-junit
          # The JUnit report, the collect preflight record, and the provenance
          # stamp travel together; a missing one fails the upload.
          path: reports/unit-junit.*
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  contract-tests:
    name: Contract Tests (simulators, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck]
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      ITSM_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: Stamp the run identity for artifact provenance
        run: make ci-stamp REPORT=contract-junit REPORT_JOB=contract-tests
      - name: Run contract tests
        run: |
          mkdir -p reports
          make test-contract PYTEST_OPTS='--junitxml=reports/contract-junit.xml'
      - name: Upload contract test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-junit
          path: reports/contract-junit.*
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  security-invariants:
    name: Security Invariant Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      ITSM_TEST_PG_DSN: postgresql://itsm:itsm_test_password@localhost:5432/itsm_test
      ITSM_TEST_NATS_URL: nats://localhost:4222
      ITSM_TEST_STRICT: "1"
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm_test_password
          POSTGRES_DB: itsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: Start NATS simulator
        run: |
          docker run -d --name itsm-nats-security-ci \
            -p 4222:4222 \
            -p 8222:8222 \
            -v "$PWD/ci/nats.conf:/etc/nats/nats-server.conf:ro" \
            nats:2.12.10-alpine \
            -c /etc/nats/nats-server.conf \
            -js
      - name: Wait for PG and NATS
        run: |
          set -e
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U itsm -d itsm_test >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:8222/jsz >/dev/null 2>&1; then
              echo "Services ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Services not ready within 30s."
          docker ps -a
          exit 1
      - name: Stamp the run identity for artifact provenance
        run: make ci-stamp REPORT=security-junit REPORT_JOB=security-invariants
      - name: Run security invariant tests
        run: |
          mkdir -p reports
          make test-security PYTEST_OPTS='--junitxml=reports/security-junit.xml'
      - name: Upload security test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-junit
          path: reports/security-junit.*
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
      - name: Cleanup simulator container
        if: always()
        run: docker rm -f itsm-nats-security-ci || true

  # --------------------------------------------------------------------------
  # Build — validate compose config, build and scan the application image
  # --------------------------------------------------------------------------
  build:
    name: Build & Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, security-invariants, contract-tests]
    permissions:
      contents: read
    env:
      # Ephemeral, test-only values so `docker compose config` can interpolate.
      POSTGRES_PASSWORD: ci-config-check-password
      ITSM_RUNTIME_DB_PASSWORD: ci-config-check-runtime-password
      ITSM_WEBHOOK_SECRET: ci-config-check-webhook-secret
      ITSM_AUTH_HMAC_SECRET: ci-config-check-hmac-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate compose file
        run: docker compose config -q
      - name: Build application image
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::Dockerfile is missing — this job must build and scan the image."
            exit 1
          fi
          docker build -t itsm-api:ci .
      - name: Container image scan (trivy, vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: itsm-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
      - name: Record the built image digest
        run: |
          mkdir -p reports
          docker image inspect itsm-api:ci --format '{{.Id}}' > reports/image-digest.txt
          echo "Built image digest: $(cat reports/image-digest.txt)"
      - name: Upload the built image digest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest
          path: reports/image-digest.txt
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # --------------------------------------------------------------------------
  # DAST — isolated OWASP ZAP baseline against the deterministic target.
  # Never scans a public or production target; see tools/dast.sh.
  # REQUIRED: a DAST failure fails the CI Verification Summary.
  # --------------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP baseline, isolated target)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: Run ZAP baseline (localhost target only)
        run: tools/dast.sh
      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dast-report
          path: reports/zap-report.*
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # --------------------------------------------------------------------------
  # Integration — real Postgres + NATS + Mockoon simulator, mocked LLM
  # --------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
    env:
      # Exact names the test fixtures read (tests/conftest.py). Must match the
      # service credentials below; mismatch previously caused silent skips.
      ITSM_TEST_PG_DSN: postgresql://itsm:itsm_test_password@localhost:5432/itsm_test
      ITSM_TEST_NATS_URL: nats://localhost:4222
      # Unreachable services are a hard FAIL, never a green-with-skips job.
      ITSM_TEST_STRICT: "1"
      ITSM_MOCKOON_ITSM_BASE_URL: http://localhost:3001
      ITSM_MOCKOON_IDENTITY_BASE_URL: http://localhost:3001
      ITSM_MOCKOON_INFRASTRUCTURE_BASE_URL: http://localhost:3001
      PYTHONHASHSEED: "0"
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm_test_password
          POSTGRES_DB: itsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache

      # Mockoon runs as a docker run step (not a service) so we control the
      # CLI flags explicitly; GitHub Actions services cannot override args.
      - name: Start NATS simulator
        run: |
          docker run -d --name itsm-nats-ci \
            -p 4222:4222 \
            -p 8222:8222 \
            -v "$PWD/ci/nats.conf:/etc/nats/nats-server.conf:ro" \
            nats:2.12.10-alpine \
            -c /etc/nats/nats-server.conf \
            -js

      - name: Start Mockoon simulator
        run: |
          docker run -d --name itsm-mockoon-ci \
            -p 3001:3001 \
            -v "$PWD/simulators/mockoon/mockoon.json:/home/mockoon/data/mockoon.json:ro" \
            mockoon/cli:9.5.0 \
            --data /home/mockoon/data/mockoon.json \
            --port 3001 \
            --disable-admin-api

      # The readiness probe is /jsz, not /healthz: a NATS server with
      # JetStream disabled answers /healthz happily and then fails the
      # fault-injection suite with ServiceUnavailableError. Asserting
      # /jsz makes that a startup failure with an obvious cause.
      - name: Wait for services (bounded, 30s)
        run: |
          set -e
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U itsm -d itsm_test >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:8222/jsz >/dev/null 2>&1 \
              && curl -sf http://127.0.0.1:3001/health >/dev/null 2>&1; then
              echo "All services ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Services not ready within 30s."
          docker ps -a
          docker logs --tail 100 itsm-mockoon-ci || true
          exit 1

      - name: Apply migrations (guarded)
        run: |
          set -e
          shopt -s nullglob
          files=(migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            # PRD §9.1.C: an empty migrations directory is a valid baseline;
            # integration tests must tolerate a database with no tables.
            echo "No migration files found — skipping (empty-DB baseline)."
          else
            for f in "${files[@]}"; do
              echo "Applying $f"
              PGPASSWORD=itsm_test_password psql -h localhost -U itsm \
                -d itsm_test -v ON_ERROR_STOP=1 -f "$f"
            done
          fi
      - name: Stamp the run identity for artifact provenance
        run: make ci-stamp REPORT=integration-junit REPORT_JOB=integration-tests
      - name: Run integration tests
        run: |
          mkdir -p reports
          make test-integration PYTEST_OPTS='--junitxml=reports/integration-junit.xml'
      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-junit
          path: reports/integration-junit.*
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Cleanup simulator container
        if: always()
        run: docker rm -f itsm-mockoon-ci itsm-nats-ci || true

  # --------------------------------------------------------------------------
  # Fault injection — worker crash, redelivery, DLQ, uncertain outcomes
  # --------------------------------------------------------------------------
  fault-injection-tests:
    name: Fault Injection Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
    env:
      ITSM_TEST_PG_DSN: postgresql://itsm:itsm_test_password@localhost:5432/itsm_test
      ITSM_TEST_NATS_URL: nats://localhost:4222
      ITSM_TEST_STRICT: "1"
      ITSM_MOCKOON_ITSM_BASE_URL: http://localhost:3001
      ITSM_MOCKOON_IDENTITY_BASE_URL: http://localhost:3001
      ITSM_MOCKOON_INFRASTRUCTURE_BASE_URL: http://localhost:3001
      PYTHONHASHSEED: "0"
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm_test_password
          POSTGRES_DB: itsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: Start NATS simulator
        run: |
          docker run -d --name itsm-nats-fi \
            -p 4222:4222 \
            -p 8222:8222 \
            -v "$PWD/ci/nats.conf:/etc/nats/nats-server.conf:ro" \
            nats:2.12.10-alpine \
            -c /etc/nats/nats-server.conf \
            -js

      # The readiness probe is /jsz, not /healthz: a NATS server with
      # JetStream disabled answers /healthz happily and then fails the
      # fault-injection suite with ServiceUnavailableError. Asserting
      # /jsz makes that a startup failure with an obvious cause.
      - name: Wait for services (bounded, 30s)
        run: |
          set -e
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U itsm -d itsm_test >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:8222/jsz >/dev/null 2>&1; then
              echo "Services ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Services not ready within 30s."
          docker ps -a
          docker logs --tail 100 itsm-nats-fi || true
          exit 1

      - name: Apply migrations (guarded)
        run: |
          set -e
          shopt -s nullglob
          files=(migrations/*.sql)
          if [ ${#files[@]} -ne 0 ]; then
            for f in "${files[@]}"; do
              echo "Applying $f"
              PGPASSWORD=itsm_test_password psql -h localhost -U itsm \
                -d itsm_test -v ON_ERROR_STOP=1 -f "$f"
            done
          fi
      - name: Stamp the run identity for artifact provenance
        run: make ci-stamp REPORT=fault-injection-junit REPORT_JOB=fault-injection-tests
      - name: Run fault injection tests
        run: |
          mkdir -p reports
          make test-fault-injection PYTEST_OPTS='--junitxml=reports/fault-injection-junit.xml'
      - name: Upload fault injection test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fault-injection-junit
          path: reports/fault-injection-junit.*
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Cleanup simulator container
        if: always()
        run: docker rm -f itsm-nats-fi || true

  # --------------------------------------------------------------------------
  # E2E — offline pipeline scenarios plus live-stack end-to-end checks
  # --------------------------------------------------------------------------
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
    env:
      ITSM_TEST_PG_DSN: postgresql://itsm:itsm_test_password@localhost:5432/itsm_test
      ITSM_TEST_NATS_URL: nats://localhost:4222
      ITSM_TEST_STRICT: "1"
      ITSM_MOCKOON_ITSM_BASE_URL: http://localhost:3001
      ITSM_MOCKOON_IDENTITY_BASE_URL: http://localhost:3001
      ITSM_MOCKOON_INFRASTRUCTURE_BASE_URL: http://localhost:3001
      PYTHONHASHSEED: "0"
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: itsm
          POSTGRES_PASSWORD: itsm_test_password
          POSTGRES_DB: itsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itsm -d itsm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: Start Mockoon simulator
        run: |
          docker run -d --name itsm-mockoon-e2e \
            -p 3001:3001 \
            -v "$PWD/simulators/mockoon/mockoon.json:/home/mockoon/data/mockoon.json:ro" \
            mockoon/cli:9.5.0 \
            --data /home/mockoon/data/mockoon.json \
            --port 3001 \
            --disable-admin-api
      - name: Wait for PostgreSQL and the simulator (bounded, 30s)
        run: |
          set -e
          for i in $(seq 1 30); do
            if pg_isready -h localhost -U itsm -d itsm_test >/dev/null 2>&1 \
              && curl -sf http://127.0.0.1:3001/health >/dev/null 2>&1; then
              echo "PostgreSQL and simulator ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Services not ready within 30s."
          docker ps -a
          docker logs --tail 100 itsm-mockoon-e2e || true
          exit 1
      - name: Apply migrations (guarded)
        run: |
          set -e
          shopt -s nullglob
          files=(migrations/*.sql)
          if [ ${#files[@]} -ne 0 ]; then
            for f in "${files[@]}"; do
              echo "Applying $f"
              PGPASSWORD=itsm_test_password psql -h localhost -U itsm \
                -d itsm_test -v ON_ERROR_STOP=1 -f "$f"
            done
          fi
      - name: Stamp the run identity for artifact provenance
        run: make ci-stamp REPORT=e2e-junit REPORT_JOB=e2e-tests
      - name: Run e2e tests
        run: |
          mkdir -p reports
          make test-e2e PYTEST_OPTS='--junitxml=reports/e2e-junit.xml'
      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-junit
          path: reports/e2e-junit.*
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
      - name: Cleanup simulator container
        if: always()
        run: docker rm -f itsm-mockoon-e2e || true

  # --------------------------------------------------------------------------
  # Scenarios — deterministic evaluation harness (offline slice; grows later)
  # --------------------------------------------------------------------------
  scenarios:
    name: Scenario Harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [integration-tests]
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      ITSM_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --reinstall-package itsm-agent --no-cache
      - name: Stamp the run identity for artifact provenance
        run: make ci-stamp REPORT=scenarios-junit REPORT_JOB=scenarios
      - name: Run scenario harness
        run: |
          mkdir -p reports
          make test-scenarios PYTEST_OPTS='--junitxml=reports/scenarios-junit.xml'
      - name: Upload scenario reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenarios-junit
          path: reports/scenarios-junit.*
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # --------------------------------------------------------------------------
  # CI Verification Summary — fails when a mandatory report is missing or red
  # --------------------------------------------------------------------------
  ci-summary:
    name: CI Verification Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - typecheck
      - secret-scan
      - workflow-security
      - supply-chain
      - unit-tests
      - contract-tests
      - security-invariants
      - build
      - dast
      - integration-tests
      - fault-injection-tests
      - e2e-tests
      - scenarios
    if: always()
    permissions:
      contents: read
      # Needed to download this run's artifacts.
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download mandatory JUnit reports
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-junit'
          path: reports
          merge-multiple: true
      - name: Verify every declared suite is run by CI
        if: always()
        run: python3 tools/ci_coverage.py
      - name: Aggregate verification summary and fail on missing groups
        if: always()
        env:
          # Serialised job results: a required job that did not succeed fails
          # the summary even when its JUnit artifact happened to be uploaded.
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 tools/ci_summary.py \
            --reports reports \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --retention-days "$ARTIFACT_RETENTION_DAYS" \
            --max-skipped 0
